name: Deploy

# develop -> staging, main -> prod. CI builds the image, then commits the new
# tag to home-lab; ArgoCD syncs it. Nothing here commits to this repo.

on:
  push:
    branches: [develop, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/madisonewebb/rollhouse

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # amd64 only: every node in the cluster is amd64.
          platforms: linux/amd64
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max

  promote:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Pick environment
        id: env
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "app_file=argocd/applications/ooglyboogly.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "app_file=argocd/applications/ooglyboogly-staging.yaml" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out home-lab
        uses: actions/checkout@v7
        with:
          repository: madisonewebb/home-lab
          ref: main
          token: ${{ secrets.HOME_LAB_TOKEN }}
          path: home-lab

      - name: Commit image tag to home-lab
        working-directory: home-lab
        env:
          APP_FILE: ${{ steps.env.outputs.app_file }}
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          test -f "$APP_FILE" || { echo "::error::$APP_FILE not found in home-lab"; exit 1; }
          yq -i '.spec.source.kustomize.images = [strenv(IMAGE_REF)]' "$APP_FILE"
          if git diff --quiet; then
            echo "$APP_FILE already at $IMAGE_REF"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(ooglyboogly): deploy $ENVIRONMENT ${GITHUB_SHA::7}"
          if ! git push origin HEAD:main; then
            echo "Push rejected; rebasing and retrying once"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  smoke:
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: task install

      - name: Wait for the new SHA, then open a game WebSocket
        env:
          ENVIRONMENT: ${{ needs.promote.outputs.environment }}
        run: |
          BASE_URL=$(grep '^BASE_URL=' "manifests/overlays/$ENVIRONMENT/config.env" | cut -d= -f2-)
          task smoke BASE_URL="$BASE_URL" EXPECTED_SHA="$GITHUB_SHA"
