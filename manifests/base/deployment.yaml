apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollhouse
spec:
  replicas: 1
  # SQLite on a ReadWriteOnce volume allows exactly one writer.
  strategy:
    type: Recreate
  template:
    spec:
      # local-path binds the volume to whichever node the pod first lands on,
      # and it must never be the NAS.
      nodeSelector:
        kubernetes.io/hostname: k3s-control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      initContainers:
        # Restore from the NAS only when the volume has no database yet and a
        # backup exists, so a dead disk loses about a second of play.
        - name: litestream-restore
          image: litestream/litestream:0.5.18
          args:
            - restore
            - -if-db-not-exists
            - -if-replica-exists
            - /data/rollhouse.db
          envFrom:
            - configMapRef:
                name: rollhouse-config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
            - name: litestream-ssh
              mountPath: /etc/litestream-ssh
              readOnly: true
            - name: tmp
              mountPath: /tmp
        # Native sidecar: starts before the app and stops after it, so the
        # last writes are shipped on shutdown.
        - name: litestream
          image: litestream/litestream:0.5.18
          restartPolicy: Always
          args: [replicate]
          envFrom:
            - configMapRef:
                name: rollhouse-config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
            - name: litestream-ssh
              mountPath: /etc/litestream-ssh
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: rollhouse
          image: ghcr.io/madisonewebb/rollhouse
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: rollhouse-config
          env:
            - name: PORT
              value: '8080'
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rollhouse-data
        - name: tmp
          emptyDir: {}
        - name: litestream-config
          configMap:
            name: rollhouse-litestream
        - name: litestream-ssh
          secret:
            secretName: rollhouse-litestream
            defaultMode: 0440
