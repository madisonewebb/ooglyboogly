apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: rollhouse
    includeSelectors: true

resources:
  - deployment.yaml
  - service.yaml
  - pvc.yaml

# The image tag is NOT set here. Each ArgoCD Application in home-lab
# (argocd/applications/rollhouse*.yaml) overrides it via
# spec.source.kustomize.images, and CI commits the new SHA there.

